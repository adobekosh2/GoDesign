<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>부동산 매매 부족자금 계산기</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f5f6f7;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            text-align: center;
            color: #111;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            text-align: right;
        }
        input:focus {
            border-color: #03c75a;
            outline: none;
        }
        .korean-unit {
            display: block;
            text-align: right;
            font-size: 13px;
            color: #03c75a;
            margin-top: 4px;
            font-weight: 500;
            min-height: 18px; /* 한글이 없을 때도 영역 유지 */
        }
        button {
            width: 100%;
            padding: 15px;
            background-color: #03c75a;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #02b350;
        }
        .result-box {
            margin-top: 25px;
            padding: 20px;
            background-color: #f9f9f9;
            border-radius: 8px;
            border-left: 5px solid #03c75a;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 15px;
        }
        .result-item.total {
            border-top: 1px solid #eee;
            padding-top: 15px;
            font-size: 18px;
            font-weight: bold;
        }
        .deficit { color: #d9534f; }
        .surplus { color: #02b350; }
    </style>
</head>
<body>

<div class="container">
    <h2>🏠 내 집 마련 계산기</h2>
    
    <div class="form-group">
        <label>1. 내가 가진 자본금 (원)</label>
        <input type="number" id="capital" placeholder="예: 150000000" value="100000000" oninput="updateKoreanUnit(this, 'capitalUnit')">
        <span class="korean-unit" id="capitalUnit"></span>
    </div>
    
    <div class="form-group">
        <label>2. KB 시세 (원) <span style="font-size:12px; color:gray;">(LTV 40% 기준점)</span></label>
        <input type="number" id="kbPrice" placeholder="예: 500000000" value="500000000" oninput="updateKoreanUnit(this, 'kbPriceUnit')">
        <span class="korean-unit" id="kbPriceUnit"></span>
    </div>
    
    <div class="form-group">
        <label>3. 실제 거래 매매가 (원)</label>
        <input type="number" id="actualPrice" placeholder="예: 480000000" value="480000000" oninput="updateKoreanUnit(this, 'actualPriceUnit')">
        <span class="korean-unit" id="actualPriceUnit"></span>
    </div>
    
    <div class="form-group">
        <label>4. 신용대출 가능 금액 (원)</label>
        <input type="number" id="creditLoan" placeholder="예: 50000000" value="50000000" oninput="updateKoreanUnit(this, 'creditLoanUnit')">
        <span class="korean-unit" id="creditLoanUnit"></span>
    </div>

    <button onclick="calculate()">부족한 금액 계산하기</button>

    <div class="result-box" id="resultBox" style="display:none;">
        <div class="result-item">
            <span>주택담보대출 가능액 (LTV 40%):</span>
            <span id="resLtvLoan">0 원</span>
        </div>
        <div class="result-item">
            <span>예상 취등록세 (약 1.1%~):</span>
            <span id="resTax" class="deficit">0 원</span>
        </div>
        <div class="result-item">
            <span>총 확보 가능 자금:</span>
            <span id="resTotalAsset">0 원</span>
        </div>
        <div class="result-item">
            <span>총 필요 지출 (매매가+세금):</span>
            <span id="resTotalCost">0 원</span>
        </div>
        <div class="result-item total">
            <span id="resultLabel">최종 결과:</span>
            <span id="finalResult">0 원</span>
        </div>
    </div>
</div>

<script>
// 숫자를 한글 만/억 단위로 변환하는 함수
function convertToKoreanWon(number) {
    if (!number || isNaN(number) || number <= 0) return "";
    
    const inputNumber = Math.floor(number);
    const unitWords = ["", "만", "억", "조"];
    let splitResult = [];
    
    let tempNumber = inputNumber;
    while (tempNumber > 0) {
        splitResult.push(tempNumber % 10000);
        tempNumber = Math.floor(tempNumber / 10000);
    }
    
    let resultString = "";
    for (let i = splitResult.length - 1; i >= 0; i--) {
        if (splitResult[i] > 0) {
            // 천 단위 콤마 포맷팅 포함 (예: 7천7백만이 아니라 7,700만)
            resultString += " " + splitResult[i].toLocaleString() + unitWords[i];
        }
    }
    
    return resultString.trim() + " 원";
}

// 인풋창에 입력할 때마다 실시간으로 한글 단위를 업데이트하는 함수
function updateKoreanUnit(inputElement, unitId) {
    const value = parseFloat(inputElement.value) || 0;
    const unitElement = document.getElementById(unitId);
    unitElement.innerText = convertToKoreanWon(value);
}

// 페이지 로드 시 기본 세팅된 숫자의 한글 단위를 보여주기 위함
window.onload = function() {
    updateKoreanUnit(document.getElementById('capital'), 'capitalUnit');
    updateKoreanUnit(document.getElementById('kbPrice'), 'kbPriceUnit');
    updateKoreanUnit(document.getElementById('actualPrice'), 'actualPriceUnit');
    updateKoreanUnit(document.getElementById('creditLoan'), 'creditLoanUnit');
};

function calculate() {
    const capital = parseFloat(document.getElementById('capital').value) || 0;
    const kbPrice = parseFloat(document.getElementById('kbPrice').value) || 0;
    const actualPrice = parseFloat(document.getElementById('actualPrice').value) || 0;
    const creditLoan = parseFloat(document.getElementById('creditLoan').value) || 0;

    const ltvLoan = kbPrice * 0.4;

    let taxRate = 0.011; 
    if (actualPrice > 600000000 && actualPrice <= 900000000) {
        taxRate = 0.024; 
    } else if (actualPrice > 900000000) {
        taxRate = 0.033;
    }
    const acquisitionTax = Math.floor(actualPrice * taxRate);

    const totalAsset = capital + ltvLoan + creditLoan;
    const totalCost = actualPrice + acquisitionTax;
    const finalBalance = totalAsset - totalCost;

    // 하단 결과창 표기 (원래대로 숫자에 콤마 적용)
    document.getElementById('resLtvLoan').innerText = ltvLoan.toLocaleString() + " 원 (" + convertToKoreanWon(ltvLoan) + ")";
    document.getElementById('resTax').innerText = acquisitionTax.toLocaleString() + " 원 (" + convertToKoreanWon(acquisitionTax) + ")";
    document.getElementById('resTotalAsset').innerText = totalAsset.toLocaleString() + " 원";
    document.getElementById('resTotalCost').innerText = totalCost.toLocaleString() + " 원";

    const finalResultEl = document.getElementById('finalResult');
    const resultLabelEl = document.getElementById('resultLabel');

    if (finalBalance < 0) {
        resultLabelEl.innerText = "🚨 부족한 금액:";
        finalResultEl.innerText = Math.abs(finalBalance).toLocaleString() + " 원 부족 (" + convertToKoreanWon(Math.abs(finalBalance)) + ")";
        finalResultEl.className = "deficit";
    } else {
        resultLabelEl.innerText = "✅ 남는 금액 (여유):";
        finalResultEl.innerText = finalBalance.toLocaleString() + " 원 남음 (" + convertToKoreanWon(finalBalance) + ")";
        finalResultEl.className = "surplus";
    }

    document.getElementById('resultBox').style.display = "block";
}
</script>

</body>
</html>
